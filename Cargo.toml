[workspace]
members = ["crates/lore", "crates/lore-core", "crates/lore-local", "crates/lore-notion", "crates/lore-resolver"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Lore — What the code doesn't tell you."
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
globset = "0.4"
